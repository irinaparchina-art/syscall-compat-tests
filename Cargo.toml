[package]
name = "syscall-compat-tests"
version = "0.1.0"
edition = "2021"
description = "Linux syscall compatibility test suite for rCore-OS ecosystem (Starry, ArceOS)"
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/syscall-compat-tests"
keywords = ["syscall", "compatibility", "rcore", "os", "testing"]

[[bin]]
name = "sct-run"
path = "src/main.rs"

[lib]
name = "syscall_compat_tests"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "=4.4.18", features = ["derive"] }
colored = "2.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.0"
